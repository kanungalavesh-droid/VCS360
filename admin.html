<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8"/>
<meta name="viewport" content="width=device-width, initial-scale=1.0"/>
<title>Blog Admin | Vardhman Consultancy Services</title>
<meta name="robots" content="noindex, nofollow"/>
<link rel="preconnect" href="https://fonts.googleapis.com"/>
<link href="https://fonts.googleapis.com/css2?family=Playfair+Display:wght@600;700&family=Inter:wght@400;500;600&display=swap" rel="stylesheet"/>
<style>
  :root {
    --navy: #0B1C3D;
    --emerald: #0E8A5A;
    --gold: #C9973A;
    --red: #C0392B;
    --white: #FFFFFF;
    --bg: #F5F7FA;
  }
  * { margin:0; padding:0; box-sizing:border-box; }
  body { font-family:'Inter',sans-serif; color:var(--navy); background:var(--bg); }
  header {
    display:flex; align-items:center; justify-content:space-between;
    padding:16px 32px; background:var(--navy); color:var(--white);
  }
  header h1 { font-family:'Playfair Display',serif; font-size:18px; }
  #logoutBtn { background:none; border:1px solid rgba(255,255,255,0.3); color:var(--white); padding:8px 16px; border-radius:8px; cursor:pointer; font-size:13px; display:none; }

  #loginScreen { max-width:380px; margin:80px auto; background:var(--white); padding:36px 32px; border-radius:14px; box-shadow:0 8px 30px rgba(11,28,61,0.1); }
  #loginScreen h2 { font-family:'Playfair Display',serif; margin-bottom:6px; }
  #loginScreen p { color:#7A8496; font-size:13px; margin-bottom:22px; }
  #loginScreen input { width:100%; padding:12px 14px; border:1px solid #DCE1EA; border-radius:8px; margin-bottom:12px; font-size:14px; }
  #loginScreen button { width:100%; padding:12px; background:var(--emerald); color:var(--white); border:none; border-radius:8px; font-weight:600; cursor:pointer; font-size:14px; }
  #loginError { color:var(--red); font-size:13px; margin-top:10px; min-height:18px; }

  #adminScreen { display:none; max-width:1000px; margin:0 auto; padding:32px 24px 60px; }
  .toolbar { display:flex; justify-content:space-between; align-items:center; margin-bottom:20px; }
  .toolbar p { color:#7A8496; font-size:13px; }
  table { width:100%; border-collapse:collapse; background:var(--white); border-radius:12px; overflow:hidden; box-shadow:0 4px 18px rgba(11,28,61,0.06); }
  th, td { text-align:left; padding:14px 16px; font-size:13px; border-bottom:1px solid #EEF1F6; vertical-align:top; }
  th { background:#F0F2F6; font-weight:600; color:#4A5468; }
  td.title-cell { max-width:280px; }
  .status-pill { display:inline-block; padding:3px 10px; border-radius:20px; font-size:11px; font-weight:600; }
  .status-pill.pub { background:#E4F5EC; color:var(--emerald); }
  .status-pill.draft { background:#F2F2F2; color:#888; }
  .row-actions { display:flex; gap:8px; }
  .row-actions button { border:none; background:#F0F2F6; padding:6px 12px; border-radius:6px; font-size:12px; cursor:pointer; }
  .row-actions button.danger { background:#FBE9E7; color:var(--red); }

  .modal-bg { display:none; position:fixed; inset:0; background:rgba(11,28,61,0.5); align-items:center; justify-content:center; z-index:200; padding:20px; }
  .modal { background:var(--white); border-radius:14px; padding:28px; width:100%; max-width:640px; max-height:85vh; overflow-y:auto; }
  .modal h3 { font-family:'Playfair Display',serif; margin-bottom:16px; }
  .modal label { display:block; font-size:12px; font-weight:600; color:#5A6578; margin:14px 0 6px; }
  .modal input, .modal textarea { width:100%; padding:10px 12px; border:1px solid #DCE1EA; border-radius:8px; font-size:13px; font-family:inherit; }
  .modal textarea { min-height:180px; resize:vertical; }
  .modal-actions { display:flex; gap:10px; margin-top:22px; justify-content:flex-end; }
  .modal-actions button { padding:10px 18px; border-radius:8px; border:none; font-size:13px; font-weight:600; cursor:pointer; }
  .btn-save { background:var(--emerald); color:var(--white); }
  .btn-cancel { background:#F0F2F6; }
  .empty { text-align:center; padding:40px; color:#8A93A6; }
</style>
</head>
<body>

<header>
  <h1>VCS Blog Admin</h1>
  <button id="logoutBtn" onclick="logout()">Log Out</button>
</header>

<div id="loginScreen">
  <h2>Admin Login</h2>
  <p>Sign in with your Supabase admin account to manage blog posts.</p>
  <input type="email" id="loginEmail" placeholder="Email"/>
  <input type="password" id="loginPassword" placeholder="Password"/>
  <button onclick="login()">Log In</button>
  <div id="loginError"></div>
</div>

<div id="adminScreen">
  <div class="toolbar">
    <p id="countMsg">Loading posts...</p>
  </div>
  <table>
    <thead>
      <tr><th>Title</th><th>Keyword</th><th>Date</th><th>Status</th><th>Actions</th></tr>
    </thead>
    <tbody id="postsBody"></tbody>
  </table>
</div>

<div class="modal-bg" id="editModalBg">
  <div class="modal">
    <h3>Edit Post</h3>
    <label>Title</label>
    <input type="text" id="editTitle"/>
    <label>Excerpt</label>
    <textarea id="editExcerpt" style="min-height:70px;"></textarea>
    <label>Content (HTML)</label>
    <textarea id="editContent"></textarea>
    <label>Image URL</label>
    <input type="text" id="editImageUrl"/>
    <label><input type="checkbox" id="editPublished" style="width:auto;display:inline-block;margin-right:6px;"/> Published (visible on the site)</label>
    <div class="modal-actions">
      <button class="btn-cancel" onclick="closeModal()">Cancel</button>
      <button class="btn-save" onclick="saveEdit()">Save Changes</button>
    </div>
  </div>
</div>

<script src="https://www.gstatic.com/firebasejs/10.14.1/firebase-app-compat.js"></script>
<script src="https://www.gstatic.com/firebasejs/10.14.1/firebase-firestore-compat.js"></script>
<script src="https://www.gstatic.com/firebasejs/10.14.1/firebase-auth-compat.js"></script>
<script>
// Same Firebase project as index.html — keep this config in sync.
const firebaseConfig = {
  apiKey: 'AIzaSyCZGJ_88fdjo88tNQU-A0mY1EYEFrX7HRg',
  authDomain: 'vcs360-website.firebaseapp.com',
  projectId: 'vcs360-website',
  storageBucket: 'vcs360-website.firebasestorage.app',
  messagingSenderId: '1052537853049',
  appId: '1:1052537853049:web:a6ddbc006106968d6370a8',
};
firebase.initializeApp(firebaseConfig);
const db = firebase.firestore();
const auth = firebase.auth();

let editingId = null;

function checkSession() {
  auth.onAuthStateChanged(user => {
    if (user) {
      showAdmin();
    } else {
      document.getElementById('loginScreen').style.display = 'block';
      document.getElementById('adminScreen').style.display = 'none';
      document.getElementById('logoutBtn').style.display = 'none';
    }
  });
}

async function login() {
  const email = document.getElementById('loginEmail').value.trim();
  const password = document.getElementById('loginPassword').value;
  const errEl = document.getElementById('loginError');
  errEl.textContent = '';

  try {
    await auth.signInWithEmailAndPassword(email, password);
  } catch (err) {
    errEl.textContent = 'Login failed: ' + err.message;
    return;
  }
  showAdmin();
}

async function logout() {
  await auth.signOut();
  location.reload();
}

function showAdmin() {
  document.getElementById('loginScreen').style.display = 'none';
  document.getElementById('adminScreen').style.display = 'block';
  document.getElementById('logoutBtn').style.display = 'inline-block';
  loadPosts();
}

function escapeHtml(str) {
  const div = document.createElement('div');
  div.textContent = str || '';
  return div.innerHTML;
}

function formatDate(iso) {
  return new Date(iso).toLocaleDateString('en-IN', { day:'numeric', month:'short', year:'numeric' });
}

let allPosts = [];

async function loadPosts() {
  const body = document.getElementById('postsBody');
  const countMsg = document.getElementById('countMsg');

  let snapshot;
  try {
    snapshot = await db.collection('blogs').orderBy('createdAt', 'desc').get();
  } catch (err) {
    console.error(err);
    countMsg.textContent = 'Could not load posts.';
    return;
  }

  allPosts = snapshot.docs.map(doc => ({ id: doc.id, ...doc.data() }));
  countMsg.textContent = allPosts.length + ' post(s)';

  if (allPosts.length === 0) {
    body.innerHTML = '<tr><td colspan="5" class="empty">No blog posts yet. They will appear here once the automated workflow generates one, or you can add posts directly in Firestore.</td></tr>';
    return;
  }

  body.innerHTML = allPosts.map(p => `
    <tr>
      <td class="title-cell">${escapeHtml(p.title)}</td>
      <td>${escapeHtml(p.keyword) || '-'}</td>
      <td>${p.createdAt ? formatDate(p.createdAt.toDate()) : ''}</td>
      <td><span class="status-pill ${p.published ? 'pub' : 'draft'}">${p.published ? 'Published' : 'Draft'}</span></td>
      <td>
        <div class="row-actions">
          <button onclick="openEdit('${p.id}')">Edit</button>
          <button onclick="togglePublish('${p.id}', ${p.published})">${p.published ? 'Unpublish' : 'Publish'}</button>
          <button class="danger" onclick="deletePost('${p.id}')">Delete</button>
        </div>
      </td>
    </tr>
  `).join('');
}

function openEdit(id) {
  const post = allPosts.find(p => p.id === id);
  if (!post) return;
  editingId = id;
  document.getElementById('editTitle').value = post.title || '';
  document.getElementById('editExcerpt').value = post.excerpt || '';
  document.getElementById('editContent').value = post.content || '';
  document.getElementById('editImageUrl').value = post.imageUrl || '';
  document.getElementById('editPublished').checked = !!post.published;
  document.getElementById('editModalBg').style.display = 'flex';
}

function closeModal() {
  document.getElementById('editModalBg').style.display = 'none';
  editingId = null;
}

async function saveEdit() {
  if (!editingId) return;
  try {
    await db.collection('blogs').doc(editingId).update({
      title: document.getElementById('editTitle').value.trim(),
      excerpt: document.getElementById('editExcerpt').value.trim(),
      content: document.getElementById('editContent').value,
      imageUrl: document.getElementById('editImageUrl').value.trim(),
      published: document.getElementById('editPublished').checked,
    });
  } catch (err) {
    alert('Save failed: ' + err.message);
    return;
  }
  closeModal();
  loadPosts();
}

async function togglePublish(id, currentlyPublished) {
  try {
    await db.collection('blogs').doc(id).update({ published: !currentlyPublished });
  } catch (err) {
    alert('Update failed: ' + err.message);
    return;
  }
  loadPosts();
}

async function deletePost(id) {
  if (!confirm('Delete this post permanently?')) return;
  try {
    await db.collection('blogs').doc(id).delete();
  } catch (err) {
    alert('Delete failed: ' + err.message);
    return;
  }
  loadPosts();
}

checkSession();
</script>
</body>
</html>
