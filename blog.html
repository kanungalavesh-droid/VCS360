<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8"/>
<meta name="viewport" content="width=device-width, initial-scale=1.0"/>
<title>Article | Vardhman Consultancy Services</title>
<link rel="preconnect" href="https://fonts.googleapis.com"/>
<link href="https://fonts.googleapis.com/css2?family=Playfair+Display:wght@500;600;700&family=Inter:wght@300;400;500;600&display=swap" rel="stylesheet"/>
<style>
  :root {
    --navy: #0B1C3D;
    --emerald: #0E8A5A;
    --gold: #C9973A;
    --gold-light: #E5B55A;
    --white: #FFFFFF;
    --bg: #F5F7FA;
  }
  * { margin:0; padding:0; box-sizing:border-box; }
  body { font-family:'Inter',sans-serif; color:var(--navy); background:var(--bg); }
  a { text-decoration:none; color:inherit; }
  nav {
    display:flex; align-items:center; justify-content:space-between;
    padding:16px 40px; background:var(--navy); position:sticky; top:0; z-index:100;
  }
  .nav-logo { display:flex; align-items:center; gap:10px; }
  .nav-logo-mark {
    width:40px; height:40px; border-radius:8px;
    background:linear-gradient(135deg, var(--gold), var(--gold-light));
    display:flex; align-items:center; justify-content:center;
    font-family:'Playfair Display',serif; font-weight:700; color:var(--navy); font-size:16px;
  }
  .nav-logo-text { display:flex; flex-direction:column; }
  .nav-logo-text span:first-child { font-family:'Playfair Display',serif; font-size:15px; font-weight:600; color:var(--white); line-height:1.1; }
  .nav-logo-text span:last-child { font-size:9px; font-weight:500; color:var(--gold); letter-spacing:1.5px; text-transform:uppercase; }
  .nav-cta { background:var(--gold); color:var(--navy); font-weight:700; padding:10px 20px; border-radius:8px; font-size:14px; }

  .wrap { max-width:760px; margin:0 auto; padding:50px 24px 90px; }
  .back { color:var(--emerald); font-weight:600; font-size:13px; display:inline-block; margin-bottom:24px; }
  .tag { color:var(--emerald); font-size:11px; font-weight:600; letter-spacing:1px; text-transform:uppercase; }
  h1 { font-family:'Playfair Display',serif; font-size:clamp(26px,4vw,38px); margin:12px 0 14px; line-height:1.25; }
  .meta { color:#8A93A6; font-size:13px; margin-bottom:28px; }
  .hero-img { width:100%; max-height:420px; object-fit:cover; border-radius:14px; margin-bottom:32px; background:#e2e6ec; }
  .content { font-size:16px; line-height:1.85; color:#2A3550; }
  .content h2 { font-family:'Playfair Display',serif; font-size:22px; margin:32px 0 14px; }
  .content h3 { font-family:'Playfair Display',serif; font-size:19px; margin:26px 0 12px; }
  .content p { margin-bottom:16px; }
  .content ul, .content ol { margin:0 0 16px 22px; }
  .content li { margin-bottom:8px; }
  .credit { margin-top:14px; font-size:11px; color:#9AA4B4; }
  .credit a { color:#9AA4B4; text-decoration:underline; }
  .cta-box { margin-top:48px; padding:28px; background:var(--navy); border-radius:14px; text-align:center; }
  .cta-box p { color:rgba(255,255,255,0.75); margin-bottom:14px; font-size:14px; }
  .cta-box a { display:inline-block; background:var(--gold); color:var(--navy); font-weight:700; padding:12px 26px; border-radius:8px; font-size:14px; }
  .status { text-align:center; padding:60px 20px; color:#7A8496; }
  footer { background:var(--navy); color:rgba(255,255,255,0.5); text-align:center; padding:28px; font-size:13px; }
</style>
</head>
<body>

<nav>
  <a href="index.html" class="nav-logo">
    <div class="nav-logo-mark">VCS</div>
    <div class="nav-logo-text">
      <span>Vardhman</span>
      <span>Consultancy Services</span>
    </div>
  </a>
  <a href="index.html#contact" class="nav-cta">Get Free Consultation</a>
</nav>

<div class="wrap">
  <a href="blogs.html" class="back">&larr; Back to Insights</a>
  <div id="postContent">
    <div class="status" id="statusMsg">Loading article...</div>
  </div>
</div>

<footer>
  &copy; <span id="year"></span> Vardhman Consultancy Services. All rights reserved.
</footer>

<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2/dist/umd/supabase.min.js"></script>
<script>
document.getElementById('year').textContent = new Date().getFullYear();

// Same Supabase project as index.html — keep these two values in sync.
const SUPABASE_URL = 'YOUR_SUPABASE_PROJECT_URL';
const SUPABASE_ANON_KEY = 'YOUR_SUPABASE_ANON_KEY';
const supabaseClient = window.supabase.createClient(SUPABASE_URL, SUPABASE_ANON_KEY);

function escapeHtml(str) {
  const div = document.createElement('div');
  div.textContent = str || '';
  return div.innerHTML;
}

function formatDate(iso) {
  return new Date(iso).toLocaleDateString('en-IN', { day:'numeric', month:'long', year:'numeric' });
}

async function loadPost() {
  const container = document.getElementById('postContent');
  const params = new URLSearchParams(window.location.search);
  const slug = params.get('slug');

  if (!slug) {
    container.innerHTML = '<div class="status">Article not found.</div>';
    return;
  }

  let data, error;
  try {
    ({ data, error } = await supabaseClient
      .from('blogs')
      .select('title,content,image_url,image_credit_name,image_credit_url,keyword,created_at')
      .eq('slug', slug)
      .eq('published', true)
      .single());
  } catch (err) {
    error = err;
  }

  if (error || !data) {
    console.error(error);
    container.innerHTML = '<div class="status">This article could not be found.</div>';
    return;
  }

  document.title = data.title + ' | Vardhman Consultancy Services';

  container.innerHTML = `
    <div class="tag">${escapeHtml(data.keyword) || 'Finance & Advisory'}</div>
    <h1>${escapeHtml(data.title)}</h1>
    <div class="meta">${formatDate(data.created_at)}</div>
    ${data.image_url ? `
      <img class="hero-img" src="${escapeHtml(data.image_url)}" alt="${escapeHtml(data.title)}"/>
      ${data.image_credit_name ? `<div class="credit">Photo by <a href="${escapeHtml(data.image_credit_url)}" target="_blank" rel="noopener">${escapeHtml(data.image_credit_name)}</a> on Unsplash</div>` : ''}
    ` : ''}
    <div class="content">${data.content}</div>
    <div class="cta-box">
      <p>Have a question about tax, GST, loans, or investments? Talk to our advisory team, free.</p>
      <a href="index.html#contact">Book Free Consultation</a>
    </div>
  `;
}

loadPost();
</script>
</body>
</html>
